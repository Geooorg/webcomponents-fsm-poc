<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Components Karte</title>
    <style>
      :root {
        --bg: #eef1f6; --surface: #fff; --border: #d5dbe5; --text: #1e293b; --muted: #94a3b8;
        --accent: #2563eb; --accent-hover: #1d4ed8;
        --radius: 12px; --shadow: 0 1px 2px rgba(15, 23, 42, .08), 0 2px 8px rgba(15, 23, 42, .04);
      }
      html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; color: var(--text); background: var(--bg); }
      main { display: flex; height: 100%; }
      .column { display: flex; flex-direction: column; }
      .column.left { flex: 0 0 200px; }
      .column.right { flex: 0 0 220px; }
      .column.left app-ok-button { margin-top: auto; }
      .column.right app-info { flex: 1; }
      .column.right app-edit-button { margin-top: auto; }
      /* Unten endet die Karte auf Höhe der Oberkante des OK-Buttons: 12px Padding + 72px Buttonhöhe. */
      app-map { flex: 1; margin: 12px 12px 84px; }
    </style>
  </head>
  <body>
    <main>
      <div class="column left">
        <app-menu></app-menu>
        <app-cancel-button></app-cancel-button>
        <app-status></app-status>
        <app-ok-button></app-ok-button>
      </div>
      <app-map></app-map>
      <div class="column right">
        <app-info></app-info>
        <app-edit-button></app-edit-button>
      </div>
    </main>
    <app-spinner></app-spinner>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
