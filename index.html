<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Components Karte</title>
    <style>
      html, body { height: 100%; margin: 0; font-family: system-ui, sans-serif; }
      main { display: flex; height: 100%; }
      .column { display: flex; flex-direction: column; }
      .column.left { flex: 0 0 200px; }
      .column.right { flex: 0 0 220px; }
      .column > :first-child { flex: 1; }
      app-map { flex: 1; }
    </style>
  </head>
  <body>
    <main>
      <div class="column left">
        <app-menu></app-menu>
        <app-cancel-button></app-cancel-button>
        <app-ok-button></app-ok-button>
      </div>
      <app-map></app-map>
      <div class="column right">
        <app-info></app-info>
        <app-freetext></app-freetext>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
